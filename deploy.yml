name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production  # আপনার Environment নাম

    steps:
    - uses: actions/checkout@v2
    
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'
        
    - name: Build and Deploy
      env:
        ADZUNA_APP_ID: ${{ secrets.APP_ID }}
        ADZUNA_APP_KEY: ${{ secrets.APP_KEY }}
      run: |
        npm install
        npm run build
