<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কারেন্সি কনভার্টার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-primary dark:text-primary">কারেন্সি কনভার্টার</h1>
        
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <div class="mb-4">
                <label for="amount" class="block text-sm font-medium mb-1">পরিমাণ</label>
                <input type="number" id="amount" class="w-full px-3 py-2 text-base border rounded-md focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600" value="1" min="0" step="any">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="fromCurrency" class="block text-sm font-medium mb-1">মুদ্রা থেকে</label>
                    <select id="fromCurrency" class="w-full px-3 py-2 text-base border rounded-md focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                        <!-- Currency options will be added dynamically -->
                    </select>
                </div>
                
                <div>
                    <label for="toCurrency" class="block text-sm font-medium mb-1">মুদ্রা পর্যন্ত</label>
                    <select id="toCurrency" class="w-full px-3 py-2 text-base border rounded-md focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                        <!-- Currency options will be added dynamically -->
                    </select>
                </div>
            </div>
            
            <button id="convertBtn" class="w-full bg-primary hover:bg-opacity-90 text-white py-2 px-4 rounded-md transition-colors mb-4">রূপান্তর করুন</button>
            
            <button id="swapBtn" class="w-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 py-2 px-4 rounded-md transition-colors mb-4 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
                মুদ্রা বিনিময় করুন
            </button>
            
            <div id="result" class="mt-4 p-4 bg-gray-100 dark:bg-gray-700 rounded-md hidden">
                <p class="text-lg font-medium" id="resultText"></p>
                <p class="text-sm mt-2" id="exchangeRate"></p>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-4">সর্বশেষ আপডেট: <span id="lastUpdate"></span></p>
            </div>
            
            <div id="errorMessage" class="mt-4 p-4 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200 rounded-md hidden"></div>
            
            <div id="loadingIndicator" class="mt-4 flex items-center justify-center hidden">
                <svg class="animate-spin h-5 w-5 text-primary mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>লোড হচ্ছে...</span>
            </div>
        </div>
        
        <div class="mt-6">
            <h2 class="text-lg font-semibold mb-2">সাম্প্রতিক রূপান্তর</h2>
            <div id="history" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 divide-y divide-gray-200 dark:divide-gray-700">
                <p class="text-center text-gray-500 dark:text-gray-400 py-2">কোন সাম্প্রতিক রূপান্তর নেই</p>
            </div>
        </div>
    </div>

    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Currencies data
        const currencies = [
            { code: "USD", name: "মার্কিন ডলার", symbol: "$", flag: "🇺🇸" },
            { code: "BDT", name: "বাংলাদেশী টাকা", symbol: "৳", flag: "🇧🇩" },
            { code: "INR", name: "ভারতীয় রুপি", symbol: "₹", flag: "🇮🇳" },
            { code: "EUR", name: "ইউরো", symbol: "€", flag: "🇪🇺" },
            { code: "GBP", name: "ব্রিটিশ পাউন্ড", symbol: "£", flag: "🇬🇧" },
            { code: "JPY", name: "জাপানি ইয়েন", symbol: "¥", flag: "🇯🇵" },
            { code: "CAD", name: "কানাডিয়ান ডলার", symbol: "C$", flag: "🇨🇦" },
            { code: "AUD", name: "অস্ট্রেলিয়ান ডলার", symbol: "A$", flag: "🇦🇺" },
            { code: "CNY", name: "চীনা ইউয়ান", symbol: "¥", flag: "🇨🇳" },
            { code: "SGD", name: "সিঙ্গাপুর ডলার", symbol: "S$", flag: "🇸🇬" },
            { code: "MYR", name: "মালয়েশিয়ান রিঙ্গিত", symbol: "RM", flag: "🇲🇾" },
            { code: "SAR", name: "সৌদি রিয়াল", symbol: "﷼", flag: "🇸🇦" },
            { code: "AED", name: "সংযুক্ত আরব আমিরাত দিরহাম", symbol: "د.إ", flag: "🇦🇪" },
            { code: "PKR", name: "পাকিস্তানি রুপি", symbol: "₨", flag: "🇵🇰" },
            { code: "NPR", name: "নেপালি রুপি", symbol: "₨", flag: "🇳🇵" }
        ];
        
        // DOM elements
        const amountInput = document.getElementById('amount');
        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const convertBtn = document.getElementById('convertBtn');
        const swapBtn = document.getElementById('swapBtn');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const exchangeRateText = document.getElementById('exchangeRate');
        const lastUpdateText = document.getElementById('lastUpdate');
        const errorMessage = document.getElementById('errorMessage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const historyContainer = document.getElementById('history');
        
        // Initialize
        let exchangeRates = {};
        let lastFetched = null;
        const conversionHistory = [];
        
        // Fill currency options
        function populateCurrencyDropdowns() {
            const fromDefault = 'USD';
            const toDefault = 'BDT';
            
            currencies.forEach(currency => {
                const fromOption = document.createElement('option');
                fromOption.value = currency.code;
                fromOption.textContent = `${currency.flag} ${currency.code} - ${currency.name}`;
                if (currency.code === fromDefault) fromOption.selected = true;
                fromCurrencySelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = currency.code;
                toOption.textContent = `${currency.flag} ${currency.code} - ${currency.name}`;
                if (currency.code === toDefault) toOption.selected = true;
                toCurrencySelect.appendChild(toOption);
            });
        }
        
        // Fetch exchange rates
        async function fetchExchangeRates() {
            try {
                showLoading(true);
                hideError();
                
                // Use ExchangeRate-API (free tier)
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (data.result === 'success') {
                    exchangeRates = data.rates;
                    lastFetched = new Date();
                    updateLastUpdatedTime();
                    showLoading(false);
                    return true;
                } else {
                    throw new Error('Failed to fetch exchange rates');
                }
            } catch (error) {
                showError('মুদ্রা হার লোড করতে ব্যর্থ হয়েছে। অনুগ্রহ করে পরে আবার চেষ্টা করুন।');
                showLoading(false);
                return false;
            }
        }
        
        // Convert currency
        function convertCurrency() {
            hideError();
            
            const amount = parseFloat(amountInput.value);
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;
            
            if (isNaN(amount) || amount <= 0) {
                showError('অনুগ্রহ করে একটি বৈধ পরিমাণ লিখুন।');
                return;
            }
            
            if (!exchangeRates[fromCurrency] || !exchangeRates[toCurrency]) {
                showError('নির্বাচিত মুদ্রার জন্য বিনিময় হার উপলব্ধ নয়।');
                return;
            }
            
            // Convert through USD base
            const usdAmount = amount / exchangeRates[fromCurrency];
            const convertedAmount = usdAmount * exchangeRates[toCurrency];
            
            // Get currency info
            const fromCurrencyInfo = currencies.find(c => c.code === fromCurrency);
            const toCurrencyInfo = currencies.find(c => c.code === toCurrency);
            
            // Display result
            resultText.innerHTML = `${amount.toLocaleString('bn-BD')} ${fromCurrencyInfo.symbol} (${fromCurrency}) = <br><span class="text-xl font-bold">${convertedAmount.toLocaleString('bn-BD')} ${toCurrencyInfo.symbol} (${toCurrency})</span>`;
            
            // Calculate and display exchange rate
            const rate = exchangeRates[toCurrency] / exchangeRates[fromCurrency];
            exchangeRateText.textContent = `1 ${fromCurrency} = ${rate.toLocaleString('bn-BD')} ${toCurrency}`;
            
            result.classList.remove('hidden');
            
            // Add to history
            addToHistory(amount, fromCurrencyInfo, convertedAmount, toCurrencyInfo);
        }
        
        // Add conversion to history
        function addToHistory(fromAmount, fromCurrencyInfo, toAmount, toCurrencyInfo) {
            const historyItem = {
                fromAmount,
                fromCurrency: fromCurrencyInfo.code,
                fromSymbol: fromCurrencyInfo.symbol,
                toAmount,
                toCurrency: toCurrencyInfo.code,
                toSymbol: toCurrencyInfo.symbol,
                timestamp: new Date()
            };
            
            conversionHistory.unshift(historyItem);
            
            // Keep only last 5 conversions
            if (conversionHistory.length > 5) {
                conversionHistory.pop();
            }
            
            updateHistoryUI();
        }
        
        // Update history in UI
        function updateHistoryUI() {
            historyContainer.innerHTML = '';
            
            if (conversionHistory.length === 0) {
                historyContainer.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 py-2">কোন সাম্প্রতিক রূপান্তর নেই</p>';
                return;
            }
            
            conversionHistory.forEach(item => {
                const time = item.timestamp.toLocaleTimeString('bn-BD');
                const historyElement = document.createElement('div');
                historyElement.className = 'py-2';
                historyElement.innerHTML = `
                    <p class="flex justify-between">
                        <span>${item.fromAmount.toLocaleString('bn-BD')} ${item.fromSymbol} (${item.fromCurrency})</span>
                        <span>→</span>
                        <span>${item.toAmount.toLocaleString('bn-BD')} ${item.toSymbol} (${item.toCurrency})</span>
                    </p>
                    <p class="text-xs text-gray-500 dark:text-gray-400 text-right">${time}</p>
                `;
                historyContainer.appendChild(historyElement);
            });
        }
        
        // Swap currencies
        function swapCurrencies() {
            const fromValue = fromCurrencySelect.value;
            const toValue = toCurrencySelect.value;
            
            fromCurrencySelect.value = toValue;
            toCurrencySelect.value = fromValue;
            
            // Re-convert if result is showing
            if (!result.classList.contains('hidden')) {
                convertCurrency();
            }
        }
        
        // Update last updated time
        function updateLastUpdatedTime() {
            if (lastFetched) {
                lastUpdateText.textContent = lastFetched.toLocaleString('bn-BD');
            }
        }
        
        // Show/hide loading indicator
        function showLoading(show) {
            if (show) {
                loadingIndicator.classList.remove('hidden');
            } else {
                loadingIndicator.classList.add('hidden');
            }
        }
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }
        
        // Hide error message
        function hideError() {
            errorMessage.classList.add('hidden');
        }
        
        // Event listeners
        convertBtn.addEventListener('click', async function() {
            if (!lastFetched || (new Date() - lastFetched) > 3600000) {
                // Fetch fresh rates if not fetched yet or older than 1 hour
                const success = await fetchExchangeRates();
                if (success) {
                    convertCurrency();
                }
            } else {
                convertCurrency();
            }
        });
        
        swapBtn.addEventListener('click', swapCurrencies);
        
        amountInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                convertBtn.click();
            }
        });
        
        // Initialize app
        async function initApp() {
            populateCurrencyDropdowns();
            const success = await fetchExchangeRates();
            // Automatically convert with default values on load
            if (success) {
                convertCurrency();
            }
        }
        
        initApp();
    </script>
</body>
</html>
