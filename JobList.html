    <script>
        const APP_ID = '9c2fc374';

        // Theme Toggle Enhancement
        const themeToggle = document.getElementById('theme-toggle');
        const sunPath = document.querySelector('.sun');
        const moonPath = document.querySelector('.moon');

        // Check system preference for dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        // Listen for changes in system preference
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeUI();
        });

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                sunPath.classList.remove('hidden');
                moonPath.classList.add('hidden');
            } else {
                sunPath.classList.add('hidden');
                moonPath.classList.remove('hidden');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeUI();
        });

        // Set initial theme based on localStorage or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Initialize UI based on theme
        updateThemeUI();

        // Enhanced Job Search with better UX
        let currentPage = 1;
        let lastSearch = { what: '', where: 'gb' };
        let isSearching = false;

        document.getElementById('search-btn').addEventListener('click', startSearch);
        
        // Allow pressing Enter to search
        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startSearch();
            }
        });
        
        document.getElementById('location').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startSearch();
            }
        });

        function startSearch() {
            if (isSearching) return;
            
            const keywordInput = document.getElementById('keyword');
            const locationInput = document.getElementById('location');
            
            // Animate search if empty
            if (!keywordInput.value.trim()) {
                keywordInput.classList.add('animate-shake');
                setTimeout(() => keywordInput.classList.remove('animate-shake'), 820);
                keywordInput.focus();
                return;
            }
            
            const what = encodeURIComponent(keywordInput.value.trim());
            const where = encodeURIComponent(locationInput.value.trim() || 'gb');
            
            currentPage = 1;
            lastSearch = { what, where };
            
            // Update UI for searching state
            isSearching = true;
            document.getElementById('search-btn').disabled = true;
            document.getElementById('search-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> খোঁজা হচ্ছে...';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-container').classList.add('opacity-50');
            document.getElementById('results-count').textContent = '';
            document.getElementById('current-page-num').textContent = currentPage;
            
            fetchJobs(what, where);
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1 && !isSearching) {
                currentPage--;
                document.getElementById('current-page-num').textContent = currentPage;
                fetchJobs(lastSearch.what, lastSearch.where);
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (!isSearching) {
                currentPage++;
                document.getElementById('current-page-num').textContent = currentPage;
                fetchJobs(lastSearch.what, lastSearch.where);
            }
        });

        async function fetchJobs(what, where) {
            isSearching = true;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-container').classList.add('opacity-50');
            
            const url = `https://api.adzuna.com/v1/api/jobs/${where}/search/${currentPage}?app_id=${APP_ID}&app_key=${APP_KEY}&results_per_page=10&what=${what}`;
            
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Network response was not ok');
                const data = await resp.json();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results-container').classList.remove('opacity-50');
                document.getElementById('search-btn').disabled = false;
                document.getElementById('search-btn').innerHTML = '<i class="fa-solid fa-magnifying-glass-arrow-right mr-2"></i> খুঁজুন';
                
                // Add results count
                if (data.count) {
                    document.getElementById('results-count').textContent = `${data.count} টি চাকরি পাওয়া গেছে`;
                }

                renderJobs(data.results || []);

                // Update pagination buttons
                document.getElementById('prev-page').disabled = currentPage === 1;
                document.getElementById('next-page').disabled = !data.results || data.results.length < 10;
                
            } catch (err) {
                console.error('Error fetching jobs:', err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results-container').classList.remove('opacity-50');
                document.getElementById('no-results').textContent = 'দুঃখিত, ডেটা লোড করতে সমস্যা হয়েছে।';
                document.getElementById('no-results').classList.remove('hidden');
                document.getElementById('job-results').innerHTML = '';
                document.getElementById('search-btn').disabled = false;
                document.getElementById('search-btn').innerHTML = '<i class="fa-solid fa-magnifying-glass-arrow-right mr-2"></i> খুঁজুন';
            }
            
            isSearching = false;
        }

        function renderJobs(jobs) {
            const container = document.getElementById('job-results');
            container.innerHTML = '';
            
            if (!jobs || jobs.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                document.getElementById('job-results').classList.add('hidden');
                return;
            }
            
            document.getElementById('no-results').classList.add('hidden');
            document.getElementById('job-results').classList.remove('hidden');

            // Create job cards with enhanced styling
            jobs.forEach(job => {
                const salary = job.salary_min && job.salary_max 
                    ? `${formatCurrency(job.salary_min)} - ${formatCurrency(job.salary_max)}` 
                    : job.salary_min 
                        ? `${formatCurrency(job.salary_min)}+` 
                        : 'বেতন উল্লেখ নেই';
                
                // Extract job categories/tags
                const categories = job.category ? job.category.tag || [] : [];
                const tagsHtml = categories.slice(0, 3).map(tag => 
                    `<span class="job-tag">${tag}</span>`
                ).join('');
                
                // Calculate days ago
                const created = new Date(job.created);
                const now = new Date();
                const diffTime = Math.abs(now - created);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const daysAgo = diffDays === 0 ? 'আজ' : `${diffDays} দিন আগে`;
                
                const card = document.createElement('div');
                card.className = 'card-3d p-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-primary transition-all duration-300';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-xl font-semibold text-primary dark:text-secondary">${job.title}</h3>
                        <span class="text-xs text-gray-500 dark:text-gray-400">${daysAgo}</span>
                    </div>
                    
                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-2 flex items-center">
                        <i class="fa-solid fa-location-dot w-4 mr-2 text-gray-400"></i>
                        ${job.location.display_name}
                    </p>
                    
                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-3 flex items-center">
                        <i class="fa-solid fa-building w-4 mr-2 text-gray-400"></i>
                        ${job.company.display_name}
                    </p>
                    
                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 flex items-center">
                        <i class="fa-solid fa-money-bill-wave w-4 mr-2 text-gray-400"></i>
                        ${salary}
                    </p>
                    
                    <div class="mb-4">
                        ${tagsHtml}
                    </div>
                    
                    <a href="${job.redirect_url}" target="_blank" 
                       class="btn-hover-effect inline-block px-4 py-2 bg-gradient-to-r from-primary to-secondary text-white rounded-lg transition-all duration-300 text-center w-full">
                        <i class="fa-solid fa-external-link mr-1"></i> বিস্তারিত দেখুন
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Helper function to format currency
        function formatCurrency(amount) {
            if (!amount) return '';
            
            // Format as thousands
            if (amount >= 1000) {
                return (amount / 1000).toFixed(1) + 'K';
            }
            
            return amount.toFixed(0);
        }

        // Auto-run search on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Start with a default search
            document.getElementById('keyword').value = '';//developer';
            startSearch();
        });

        // Add smooth scrolling for better UX
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Add animation to cards on scroll
        function animateOnScroll() {
            const cards = document.querySelectorAll('.card-3d');
            cards.forEach(card => {
                const cardTop = card.getBoundingClientRect().top;
                const windowHeight = window.innerHeight;
                if (cardTop < windowHeight * 0.85) {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }
            });
        }

        // Initialize cards with opacity 0 and transformed down
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card-3d');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transitionDelay = `${index * 0.1}s`;
            });
            
            // Trigger animation on initial load
            setTimeout(animateOnScroll, 300);
        });

        // Listen for scroll events
        window.addEventListener('scroll', animateOnScroll);
    </script>
</body>
</html>
