<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search - Adzuna Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ads Scripts -->
    <script type='text/javascript' src='//pl26717244.profitableratecpm.com/bf/51/a4/bf51a42d984554beaaed4a58dcdb733d.js'></script>
    <script type='text/javascript' src='//pl26713337.profitableratecpm.com/64/66/f1/6466f1b7fea6c93f404f4ab49960b99c.js'></script>
    <script async="async" data-cfasync="false" src="//pl26713372.profitableratecpm.com/1a6d5fbc149d94ff8c697b1327966995/invoke.js"></script>

    <style>
        /* Dark mode transitions */
        .dark-mode-transition {
            transition: all 0.3s ease-in-out;
        }

        /* 3D Card Effect */
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.3s ease-in-out;
        }
        
        .card-3d:hover {
            transform: translateY(-5px) rotateX(5deg);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Loading animation */
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #5D5CDE;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom theme colors */
        :root {
            --primary: #5D5CDE;
            --secondary: #6366F1;
            --accent: #F59E0B;
        }

        .dark {
            --primary: #6366F1;
            --secondary: #818CF8;
        }
    </style>
</head>
<body class="font-sans bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4">
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path class="sun hidden" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>
    </div>

    <!-- Header with 3D effect -->
    <div class="max-w-4xl mx-auto mb-12 text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-4 animate-float">
            Job Search <span class="hidden sm:inline">|</span> <span class="block sm:inline">চাকরি খুঁজুন</span>
        </h1>
    </div>

    <!-- Enhanced Search Form -->
    <div class="max-w-4xl mx-auto mb-8">
        <div class="card-3d bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="keyword" type="text" placeholder="Job title, keywords..." 
                       class="px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary" />
                <input id="location" type="text" placeholder="Location (e.g., gb, us)" 
                       class="px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary" />
                <button id="search-btn" 
                        class="px-4 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg hover:opacity-90 transition-all duration-300">
                    খুঁজুন
                </button>
            </div>
        </div>
    </div>

    <!-- Ad Container -->
    <div class="ad-container max-w-4xl mx-auto mb-8 bg-white dark:bg-gray-800 p-4 rounded-xl">
        <div id="container-1a6d5fbc149d94ff8c697b1327966995"></div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden max-w-4xl mx-auto text-center my-8">
        <div class="loading-spinner"></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">অনুসন্ধান করা হচ্ছে...</p>
    </div>

    <!-- Results Container -->
    <div id="results-container" class="max-w-4xl mx-auto">
        <div id="job-results" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        <div id="no-results" class="hidden text-center text-gray-500 mt-4 p-8 bg-white dark:bg-gray-800 rounded-xl">
            কোনো চাকরি পাওয়া যায়নি।
        </div>
    </div>

    <!-- Additional Ad Container -->
    <div class="ad-container max-w-4xl mx-auto mt-8 bg-white dark:bg-gray-800 p-4 rounded-xl">
        <script type="text/javascript">
            atOptions = {
                'key' : '9d28964d0cf3efa6afb4b9626542fa30',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
            };
            document.write('<scr' + 'ipt type="text/javascript" src="//www.highperformanceformat.com/9d28964d0cf3efa6afb4b9626542fa30/invoke.js"></scr' + 'ipt>');
        </script>
    </div>

    <script>
        const APP_ID = '9c2fc374';
        const APP_KEY = 'bd17fc711b279bb5c80faaf11a77c20e';

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // Set initial theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // Enhanced Job Search
        document.getElementById('search-btn').addEventListener('click', () => {
            const what = encodeURIComponent(document.getElementById('keyword').value.trim());
            const where = encodeURIComponent(document.getElementById('location').value.trim() || 'gb');
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results-container').classList.add('hidden');
            
            fetchJobs(what, where);
        });

        async function fetchJobs(what, where) {
            const url = `https://api.adzuna.com/v1/api/jobs/${where}/search/1?app_id=${APP_ID}&app_key=${APP_KEY}&results_per_page=10&what=${what}`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Network response was not ok');
                const data = await resp.json();
                
                // Hide loading, show results
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results-container').classList.remove('hidden');
                
                renderJobs(data.results);
            } catch (err) {
                console.error('Error fetching jobs:', err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('no-results').textContent = 'দুঃখিত, ডেটা লোড করতে সমস্যা হয়েছে।';
                document.getElementById('no-results').classList.remove('hidden');
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('job-results');
            container.innerHTML = '';
            
            if (!jobs || jobs.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }
            
            document.getElementById('no-results').classList.add('hidden');

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'card-3d p-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-primary transition-all duration-300';
                card.innerHTML = `
                    <h3 class="text-xl font-semibold text-primary dark:text-secondary mb-2">${job.title}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        </svg>
                        ${job.location.display_name}
                    </p>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5"/>
                        </svg>
                        ${job.company.display_name}
                    </p>
                    <a href="${job.redirect_url}" target="_blank" 
                       class="inline-block px-4 py-2 bg-gradient-to-r from-primary to-secondary text-white rounded-lg hover:opacity-90 transition-all duration-300">
                        বিস্তারিত দেখুন
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // আপনার বর্তমান script ট্যাগের ভিতরে এই কোড যোগ করুন
document.addEventListener('DOMContentLoaded', function() {
    // সার্চ বাটন খুঁজে বের করা
    const searchButton = document.getElementById('search-btn');
    
    // যদি বাটন পাওয়া যায়, তবে ক্লিক করা
    if (searchButton) {
        searchButton.click();
        console.log('সার্চ বাটনে অটোমেটিক ক্লিক করা হয়েছে');
    } else {
        console.error('সার্চ বাটন পাওয়া যায়নি');
    }
});
    </script>
</body>
</html>
