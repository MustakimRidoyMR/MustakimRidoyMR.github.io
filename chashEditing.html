    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        let editor;
        let currentTheme = 'vs-dark';
        let sidebarHidden = false;
        let spellCheckEnabled = false;
        let whitespaceVisible = false;
        
        let files = {
            'main.cs': `using System;
using System.Collections.Generic;
using System.Linq;

namespace CSharpEditor
{
    /// <summary>
    /// Main program class demonstrating C# features
    /// </summary>
    public class Program
    {
        // Entry point of the application
        public static void Main(string[] args)
        {
            Console.WriteLine("Welcome to C# Code Editor Pro!");
            
            // Example: Working with collections
            var numbers = new List<int> { 1, 2, 3, 4, 5 };
            var evenNumbers = numbers.Where(n => n % 2 == 0).ToList();
            
            Console.WriteLine($"Even numbers: {string.Join(", ", evenNumbers)}");
            
            /* Multi-line comment example
               This demonstrates block comments
               that span multiple lines */
            
            // Single line comment
            DisplayMessage("Hello World!"); // Inline comment
        }
        
        /// <summary>
        /// Displays a formatted message
        /// </summary>
        /// <param name="message">The message to display</param>
        private static void DisplayMessage(string message)
        {
            Console.WriteLine($"Message: {message}"); // Another inline comment
        }
    }
    
    // Additional class example
    public class Person
    {
        public string Name { get; set; }
        public int Age { get; set; }
        
        public Person(string name, int age)
        {
            Name = name;
            Age = age;
        }
        
        public override string ToString()
        {
            return $"Name: {Name}, Age: {Age}";
        }
    }
}`
        };
        let currentFile = 'main.cs';

        // Initialize Monaco Editor
        require.config({ 
            paths: { 
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
            } 
        });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: files[currentFile],
                language: 'csharp',
                theme: currentTheme,
                fontSize: 14,
                automaticLayout: true,
                minimap: { enabled: true },
                wordWrap: 'off',
                lineNumbers: 'on',
                renderWhitespace: 'boundary',
                bracketMatching: 'always',
                folding: true,
                suggest: {
                    enabled: true
                },
                quickSuggestions: true,
                parameterHints: {
                    enabled: true
                }
            });

            // Update cursor position
            editor.onDidChangeCursorPosition((e) => {
                document.getElementById('lineNumber').textContent = e.position.lineNumber;
                document.getElementById('columnNumber').textContent = e.position.column;
            });

            // Update selection info
            editor.onDidChangeCursorSelection((e) => {
                const selection = editor.getSelection();
                if (selection.isEmpty()) {
                    document.getElementById('selectionInfo').textContent = '0';
                } else {
                    const selectedText = editor.getModel().getValueInRange(selection);
                    document.getElementById('selectionInfo').textContent = selectedText.length;
                }
            });

            // Save content when changed and update stats
            editor.onDidChangeModelContent(() => {
                files[currentFile] = editor.getValue();
                updateStats();
            });

            // Initial stats update
            updateStats();
        });

        // Custom modal functions
        function showModal(title, content, actions) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalActions').innerHTML = actions;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function showAlert(message) {
            showModal('Information', `<p class="text-gray-700 dark:text-gray-300">${message}</p>`, 
                '<button class="px-4 py-2 bg-primary text-white rounded hover:bg-primary/90" onclick="hideModal()">OK</button>');
        }

        function showConfirm(message, onConfirm) {
            showModal('Confirm', `<p class="text-gray-700 dark:text-gray-300">${message}</p>`, 
                `<button class="px-4 py-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded mr-2" onclick="hideModal()">Cancel</button>
                 <button class="px-4 py-2 bg-red-500 text-white hover:bg-red-600 rounded" onclick="hideModal(); (${onConfirm})()">Confirm</button>`);
        }

        // Stats update function
        function updateStats() {
            if (!editor) return;
            
            const content = editor.getValue();
            const lines = content.split('\n');
            const words = content.trim() ? content.trim().split(/\s+/) : [];
            
            document.getElementById('charCount').textContent = content.length;
            document.getElementById('wordCount').textContent = words.length;
            document.getElementById('lineCount').textContent = lines.length;
            
            // Simple error detection (basic syntax errors)
            const errors = detectSimpleErrors(content);
            document.getElementById('errorCount').textContent = errors;
        }

        // Simple error detection
        function detectSimpleErrors(content) {
            let errorCount = 0;
            const lines = content.split('\n');
            
            lines.forEach(line => {
                // Check for unmatched brackets
                const openBrackets = (line.match(/\{/g) || []).length;
                const closeBrackets = (line.match(/\}/g) || []).length;
                const openParens = (line.match(/\(/g) || []).length;
                const closeParens = (line.match(/\)/g) || []).length;
                
                if (openBrackets !== closeBrackets) errorCount++;
                if (openParens !== closeParens) errorCount++;
                
                // Check for missing semicolons (basic check)
                if (line.trim() && 
                    !line.trim().endsWith(';') && 
                    !line.trim().endsWith('{') && 
                    !line.trim().endsWith('}') &&
                    !line.trim().startsWith('//') &&
                    !line.trim().startsWith('/*') &&
                    !line.trim().includes('using ') &&
                    !line.trim().includes('namespace ') &&
                    !line.trim().includes('class ') &&
                    !line.trim().includes('public ') &&
                    !line.trim().includes('private ') &&
                    !line.trim().includes('protected ') &&
                    line.trim().length > 5) {
                    errorCount++;
                }
            });
            
            return errorCount;
        }

        // Sidebar toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarToggle');
            
            if (sidebarHidden) {
                sidebar.style.marginLeft = '0px';
                sidebar.style.width = '288px';
                toggleBtn.textContent = '◀';
                sidebarHidden = false;
            } else {
                sidebar.style.marginLeft = '-288px';
                sidebar.style.width = '288px';
                toggleBtn.textContent = '▶';
                sidebarHidden = true;
            }
        }

        // Tool functions
        function executeEditorAction(actionId) {
            if (editor && editor.getAction(actionId)) {
                editor.getAction(actionId).run();
            }
        }

        function toggleLineComment() {
            executeEditorAction('editor.action.commentLine');
        }

        function toggleBlockComment() {
            executeEditorAction('editor.action.blockComment');
        }

        function removeAllComments() {
            showConfirm('Are you sure you want to remove all comments from the code?', () => {
                let content = editor.getValue();
                content = content.replace(/\/\*[\s\S]*?\*\//g, '');
                content = content.replace(/\/\/.*$/gm, '');
                content = content.replace(/^\s*\n/gm, '');
                content = content.replace(/\s+$/gm, '');
                content = content.replace(/\n\s*\n\s*\n/g, '\n\n');
                editor.setValue(content);
                showAlert('All comments have been removed');
            });
        }

        function removeDuplicateLines() {
            showConfirm('Are you sure you want to remove duplicate lines?', () => {
                let content = editor.getValue();
                let lines = content.split('\n');
                let uniqueLines = [];
                let seenLines = new Set();
                
                for (let line of lines) {
                    let trimmedLine = line.trim();
                    if (!seenLines.has(trimmedLine) || trimmedLine === '') {
                        uniqueLines.push(line);
                        if (trimmedLine !== '') {
                            seenLines.add(trimmedLine);
                        }
                    }
                }
                
                editor.setValue(uniqueLines.join('\n'));
                showAlert('Duplicate lines have been removed');
            });
        }

        function formatCode() {
            executeEditorAction('editor.action.formatDocument');
            showAlert('Code formatted successfully');
        }

        function openFindReplace() {
            executeEditorAction('editor.action.startFindReplaceAction');
        }

        function duplicateLine() {
            executeEditorAction('editor.action.copyLinesDownAction');
        }

        function makeUppercase() {
            executeEditorAction('editor.action.transformToUppercase');
        }

        function makeLowercase() {
            executeEditorAction('editor.action.transformToLowercase');
        }

        function moveLineUp() {
            executeEditorAction('editor.action.moveLinesUpAction');
        }

        function moveLineDown() {
            executeEditorAction('editor.action.moveLinesDownAction');
        }

        function sortLines() {
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            if (selectedText) {
                const lines = selectedText.split('\n').sort();
                editor.executeEdits('sort-lines', [{
                    range: selection,
                    text: lines.join('\n')
                }]);
                showAlert('Selected lines sorted');
            } else {
                showAlert('Please select text to sort');
            }
        }

        function joinLines() {
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            if (selectedText) {
                const joinedText = selectedText.replace(/\n/g, ' ');
                editor.executeEdits('join-lines', [{
                    range: selection,
                    text: joinedText
                }]);
                showAlert('Lines joined');
            } else {
                showAlert('Please select lines to join');
            }
        }

        function tabifyLines() {
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            if (selectedText) {
                const tabifiedText = selectedText.replace(/    /g, '\t');
                editor.executeEdits('tabify', [{
                    range: selection,
                    text: tabifiedText
                }]);
                showAlert('Lines tabified');
            } else {
                showAlert('Please select text to tabify');
            }
        }

        function untabifyLines() {
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            if (selectedText) {
                const untabifiedText = selectedText.replace(/\t/g, '    ');
                editor.executeEdits('untabify', [{
                    range: selection,
                    text: untabifiedText
                }]);
                showAlert('Lines untabified');
            } else {
                showAlert('Please select text to untabify');
            }
        }

        function newFile() {
            const fileName = 'Program' + Math.random().toString(36).substr(2, 5) + '.cs';
            files[fileName] = `using System;

namespace NewNamespace
{
    public class Program
    {
        public static void Main(string[] args)
        {
            // Your code here
            Console.WriteLine("Hello World!");
        }
    }
}`;
            switchToFile(fileName);
            updateFileTabs();
        }

        function loadFile() {
            document.getElementById('fileInput').click();
        }

        function saveFile() {
            const content = editor.getValue();
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile;
            a.click();
            URL.revokeObjectURL(url);
            showAlert(`File "${currentFile}" saved successfully`);
        }

        function switchToFile(fileName) {
            files[currentFile] = editor.getValue();
            currentFile = fileName;
            editor.setValue(files[currentFile]);
            updateFileTabs();
        }

        function updateFileTabs() {
            const tabsContainer = document.getElementById('fileTabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(files).forEach(fileName => {
                const tabElement = document.createElement('div');
                tabElement.className = `tab-item px-2 py-1 text-xs rounded cursor-pointer flex items-center ${fileName === currentFile ? 'bg-primary text-white' : 'bg-white dark:bg-dark-bg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}`;
                tabElement.dataset.file = fileName;
                tabElement.innerHTML = `
                    <span class="mr-1">📄</span> ${fileName}
                    <button class="ml-auto hover:text-red-500" onclick="closeFile('${fileName}')">×</button>
                `;
                tabElement.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        switchToFile(fileName);
                    }
                });
                tabsContainer.appendChild(tabElement);
            });
        }

        function closeFile(fileName) {
            if (Object.keys(files).length === 1) {
                showAlert('Cannot close the last file');
                return;
            }
            
            delete files[fileName];
            if (currentFile === fileName) {
                currentFile = Object.keys(files)[0];
                editor.setValue(files[currentFile]);
            }
            updateFileTabs();
        }

        // Event listeners
        document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
        document.getElementById('newFileBtn').addEventListener('click', newFile);
        document.getElementById('loadFileBtn').addEventListener('click', loadFile);
        document.getElementById('saveFileBtn').addEventListener('click', saveFile);
        
        // Edit buttons
        document.getElementById('undoBtn').addEventListener('click', () => executeEditorAction('undo'));
        document.getElementById('redoBtn').addEventListener('click', () => executeEditorAction('redo'));
        document.getElementById('cutBtn').addEventListener('click', () => executeEditorAction('editor.action.clipboardCutAction'));
        document.getElementById('copyBtn').addEventListener('click', () => executeEditorAction('editor.action.clipboardCopyAction'));
        document.getElementById('pasteBtn').addEventListener('click', () => executeEditorAction('editor.action.clipboardPasteAction'));
        document.getElementById('selectAllBtn').addEventListener('click', () => executeEditorAction('editor.action.selectAll'));
        document.getElementById('duplicateBtn').addEventListener('click', duplicateLine);
        document.getElementById('deleteBtn').addEventListener('click', () => executeEditorAction('deleteRight'));
        
        // Format buttons
        document.getElementById('formatCode').addEventListener('click', formatCode);
        document.getElementById('makeUppercase').addEventListener('click', makeUppercase);
        document.getElementById('makeLowercase').addEventListener('click', makeLowercase);
        document.getElementById('tabifyLines').addEventListener('click', tabifyLines);
        document.getElementById('untabifyLines').addEventListener('click', untabifyLines);
        document.getElementById('moveLineUp').addEventListener('click', moveLineUp);
        document.getElementById('moveLineDown').addEventListener('click', moveLineDown);
        document.getElementById('sortLines').addEventListener('click', sortLines);
        document.getElementById('joinLines').addEventListener('click', joinLines);
        
        // Advanced buttons
        document.getElementById('removeDuplicateLines').addEventListener('click', removeDuplicateLines);
        document.getElementById('findReplace').addEventListener('click', openFindReplace);
        document.getElementById('incrementalSearch').addEventListener('click', () => executeEditorAction('actions.find'));
        document.getElementById('expandSelection').addEventListener('click', () => executeEditorAction('editor.action.smartSelect.expand'));
        document.getElementById('contractSelection').addEventListener('click', () => executeEditorAction('editor.action.smartSelect.shrink'));
        
        // Comment buttons
        document.getElementById('toggleLineComment').addEventListener('click', toggleLineComment);
        document.getElementById('toggleBlockComment').addEventListener('click', toggleBlockComment);
        document.getElementById('removeAllComments').addEventListener('click', removeAllComments);
        
        // View buttons
        document.getElementById('toggleMinimap').addEventListener('click', () => {
            const currentOption = editor.getOption(monaco.editor.EditorOption.minimap);
            editor.updateOptions({ minimap: { enabled: !currentOption.enabled } });
        });
        
        document.getElementById('toggleWordWrap').addEventListener('click', () => {
            const currentWrap = editor.getOption(monaco.editor.EditorOption.wordWrap);
            editor.updateOptions({ wordWrap: currentWrap === 'on' ? 'off' : 'on' });
        });
        
        document.getElementById('viewWhiteSpace').addEventListener('click', () => {
            whitespaceVisible = !whitespaceVisible;
            editor.updateOptions({ 
                renderWhitespace: whitespaceVisible ? 'all' : 'boundary' 
            });
        });
        
        document.getElementById('toggleSpellCheck').addEventListener('click', () => {
            spellCheckEnabled = !spellCheckEnabled;
            showAlert(`Spell check ${spellCheckEnabled ? 'enabled' : 'disabled'}`);
        });

        document.getElementById('themeSelect').addEventListener('change', (e) => {
            currentTheme = e.target.value;
            monaco.editor.setTheme(currentTheme);
        });

        document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
            editor.updateOptions({ fontSize: parseInt(e.target.value) });
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileName = file.name;
                    files[fileName] = e.target.result;
                    switchToFile(fileName);
                };
                reader.readAsText(file);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 's':
                        e.preventDefault();
                        saveFile();
                        break;
                    case 'n':
                        e.preventDefault();
                        newFile();
                        break;
                    case '/':
                        e.preventDefault();
                        toggleLineComment();
                        break;
                    case 'd':
                        e.preventDefault();
                        duplicateLine();
                        break;
                    case 'f':
                        e.preventDefault();
                        openFindReplace();
                        break;
                }
            }
        });
    </script>
</body>
</html>
