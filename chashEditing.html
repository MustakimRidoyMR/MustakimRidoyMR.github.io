    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        let editor;
        let currentTheme = 'vs-dark';
        let files = {
            'main.cs': `using System;
using System.Collections.Generic;
using System.Linq;

namespace CSharpEditor
{
    /// <summary>
    /// Main program class demonstrating C# features
    /// </summary>
    public class Program
    {
        // Entry point of the application
        public static void Main(string[] args)
        {
            Console.WriteLine("Welcome to C# Code Editor Pro!");
            
            // Example: Working with collections
            var numbers = new List<int> { 1, 2, 3, 4, 5 };
            var evenNumbers = numbers.Where(n => n % 2 == 0).ToList();
            
            Console.WriteLine($"Even numbers: {string.Join(", ", evenNumbers)}");
            
            /* Multi-line comment example
               This demonstrates block comments
               that span multiple lines */
            
            // Single line comment
            DisplayMessage("Hello World!");
        }
        
        /// <summary>
        /// Displays a formatted message
        /// </summary>
        /// <param name="message">The message to display</param>
        private static void DisplayMessage(string message)
        {
            Console.WriteLine($"Message: {message}");
        }
    }
    
    // Additional class example
    public class Person
    {
        public string Name { get; set; }
        public int Age { get; set; }
        
        public Person(string name, int age)
        {
            Name = name;
            Age = age;
        }
        
        public override string ToString()
        {
            return $"Name: {Name}, Age: {Age}";
        }
    }
}`
        };
        let currentFile = 'main.cs';

        // Initialize Monaco Editor
        require.config({ 
            paths: { 
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
            } 
        });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: files[currentFile],
                language: 'csharp',
                theme: currentTheme,
                fontSize: 14,
                automaticLayout: true,
                minimap: { enabled: true },
                wordWrap: 'off',
                lineNumbers: 'on',
                renderWhitespace: 'boundary',
                bracketMatching: 'always',
                folding: true,
                suggest: {
                    enabled: true
                },
                quickSuggestions: true,
                parameterHints: {
                    enabled: true
                }
            });

            // Update cursor position
            editor.onDidChangeCursorPosition((e) => {
                document.getElementById('lineNumber').textContent = e.position.lineNumber;
                document.getElementById('columnNumber').textContent = e.position.column;
            });

            // Update selection info
            editor.onDidChangeCursorSelection((e) => {
                const selection = editor.getSelection();
                if (selection.isEmpty()) {
                    document.getElementById('selectionInfo').textContent = 'None';
                } else {
                    const startLine = selection.startLineNumber;
                    const endLine = selection.endLineNumber;
                    const selectedText = editor.getModel().getValueInRange(selection);
                    document.getElementById('selectionInfo').textContent = 
                        `${selectedText.length} chars (Lines ${startLine}-${endLine})`;
                }
            });

            // Save content when changed
            editor.onDidChangeModelContent(() => {
                files[currentFile] = editor.getValue();
            });
        });

        // Custom modal functions
        function showModal(title, content, actions) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalActions').innerHTML = actions;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function showAlert(message) {
            showModal('Information', `<p class="text-gray-700 dark:text-gray-300">${message}</p>`, 
                '<button class="px-4 py-2 bg-primary text-white rounded hover:bg-primary/90" onclick="hideModal()">OK</button>');
        }

        function showConfirm(message, onConfirm) {
            showModal('Confirm', `<p class="text-gray-700 dark:text-gray-300">${message}</p>`, 
                `<button class="px-4 py-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded mr-2" onclick="hideModal()">Cancel</button>
                 <button class="px-4 py-2 bg-red-500 text-white hover:bg-red-600 rounded" onclick="hideModal(); (${onConfirm})()">Confirm</button>`);
        }

        // Tool functions
        function toggleLineComment() {
            const selection = editor.getSelection();
            const model = editor.getModel();
            
            if (selection.isEmpty()) {
                // Toggle comment for current line
                const lineNumber = selection.startLineNumber;
                const lineContent = model.getLineContent(lineNumber);
                const trimmed = lineContent.trim();
                
                if (trimmed.startsWith('//')) {
                    // Remove comment
                    const newContent = lineContent.replace(/^\s*\/\/\s?/, '');
                    const range = new monaco.Range(lineNumber, 1, lineNumber, lineContent.length + 1);
                    editor.executeEdits('toggle-comment', [{
                        range: range,
                        text: newContent
                    }]);
                } else {
                    // Add comment
                    const indentMatch = lineContent.match(/^(\s*)/);
                    const indent = indentMatch ? indentMatch[1] : '';
                    const newContent = indent + '// ' + lineContent.substring(indent.length);
                    const range = new monaco.Range(lineNumber, 1, lineNumber, lineContent.length + 1);
                    editor.executeEdits('toggle-comment', [{
                        range: range,
                        text: newContent
                    }]);
                }
            } else {
                // Toggle comment for selected lines
                const startLine = selection.startLineNumber;
                const endLine = selection.endLineNumber;
                
                for (let lineNumber = startLine; lineNumber <= endLine; lineNumber++) {
                    const lineContent = model.getLineContent(lineNumber);
                    const trimmed = lineContent.trim();
                    
                    if (trimmed.startsWith('//')) {
                        const newContent = lineContent.replace(/^\s*\/\/\s?/, '');
                        const range = new monaco.Range(lineNumber, 1, lineNumber, lineContent.length + 1);
                        editor.executeEdits('toggle-comment', [{
                            range: range,
                            text: newContent
                        }]);
                    } else {
                        const indentMatch = lineContent.match(/^(\s*)/);
                        const indent = indentMatch ? indentMatch[1] : '';
                        const newContent = indent + '// ' + lineContent.substring(indent.length);
                        const range = new monaco.Range(lineNumber, 1, lineNumber, lineContent.length + 1);
                        editor.executeEdits('toggle-comment', [{
                            range: range,
                            text: newContent
                        }]);
                    }
                }
            }
        }

        function toggleBlockComment() {
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            if (selectedText) {
                if (selectedText.startsWith('/*') && selectedText.endsWith('*/')) {
                    // Remove block comment
                    const newText = selectedText.substring(2, selectedText.length - 2);
                    editor.executeEdits('toggle-block-comment', [{
                        range: selection,
                        text: newText
                    }]);
                } else {
                    // Add block comment
                    const newText = '/* ' + selectedText + ' */';
                    editor.executeEdits('toggle-block-comment', [{
                        range: selection,
                        text: newText
                    }]);
                }
            } else {
                showAlert('Please select text to toggle block comment');
            }
        }

        function removeAllComments() {
            showConfirm('Are you sure you want to remove all comments from the code?', () => {
                let content = editor.getValue();
                // Remove single line comments
                content = content.replace(/^\s*\/\/.*$/gm, '');
                // Remove block comments
                content = content.replace(/\/\*[\s\S]*?\*\//g, '');
                // Remove empty lines
                content = content.replace(/^\s*\n/gm, '');
                editor.setValue(content);
                showAlert('All comments have been removed');
            });
        }

        function formatCode() {
            editor.getAction('editor.action.formatDocument').run();
            showAlert('Code formatted successfully');
        }

        function openFindReplace() {
            editor.getAction('editor.action.startFindReplaceAction').run();
        }

        function duplicateLine() {
            editor.getAction('editor.action.copyLinesDownAction').run();
        }

        function newFile() {
            const fileName = Math.random().toString(36).substr(2, 9) + '.cs';
            files[fileName] = `using System;

namespace NewFile
{
    public class Program
    {
        public static void Main(string[] args)
        {
            // Your code here
            Console.WriteLine("Hello World!");
        }
    }
}`;
            switchToFile(fileName);
            updateFileTabs();
        }

        function loadFile() {
            document.getElementById('fileInput').click();
        }

        function saveFile() {
            const content = editor.getValue();
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile;
            a.click();
            URL.revokeObjectURL(url);
            showAlert(`File "${currentFile}" saved successfully`);
        }

        function switchToFile(fileName) {
            files[currentFile] = editor.getValue();
            currentFile = fileName;
            editor.setValue(files[currentFile]);
            updateFileTabs();
        }

        function updateFileTabs() {
            const tabsContainer = document.getElementById('fileTabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(files).forEach(fileName => {
                const tabElement = document.createElement('div');
                tabElement.className = `tab-item px-3 py-2 rounded cursor-pointer ${fileName === currentFile ? 'bg-primary text-white' : 'bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-500'}`;
                tabElement.dataset.file = fileName;
                tabElement.innerHTML = `
                    📄 ${fileName}
                    <button class="float-right hover:text-red-500 ml-2" onclick="closeFile('${fileName}')">×</button>
                `;
                tabElement.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        switchToFile(fileName);
                    }
                });
                tabsContainer.appendChild(tabElement);
            });
        }

        function closeFile(fileName) {
            if (Object.keys(files).length === 1) {
                showAlert('Cannot close the last file');
                return;
            }
            
            delete files[fileName];
            if (currentFile === fileName) {
                currentFile = Object.keys(files)[0];
                editor.setValue(files[currentFile]);
            }
            updateFileTabs();
        }

        // Event listeners
        document.getElementById('newFileBtn').addEventListener('click', newFile);
        document.getElementById('loadFileBtn').addEventListener('click', loadFile);
        document.getElementById('saveFileBtn').addEventListener('click', saveFile);
        document.getElementById('toggleLineComment').addEventListener('click', toggleLineComment);
        document.getElementById('toggleBlockComment').addEventListener('click', toggleBlockComment);
        document.getElementById('removeAllComments').addEventListener('click', removeAllComments);
        document.getElementById('formatCode').addEventListener('click', formatCode);
        document.getElementById('findReplace').addEventListener('click', openFindReplace);
        document.getElementById('duplicateLine').addEventListener('click', duplicateLine);

        document.getElementById('themeSelect').addEventListener('change', (e) => {
            currentTheme = e.target.value;
            monaco.editor.setTheme(currentTheme);
        });

        document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
            editor.updateOptions({ fontSize: parseInt(e.target.value) });
        });

        document.getElementById('toggleMinimap').addEventListener('click', () => {
            const currentOption = editor.getOption(monaco.editor.EditorOption.minimap);
            editor.updateOptions({ minimap: { enabled: !currentOption.enabled } });
        });

        document.getElementById('toggleWordWrap').addEventListener('click', () => {
            const currentWrap = editor.getOption(monaco.editor.EditorOption.wordWrap);
            editor.updateOptions({ wordWrap: currentWrap === 'on' ? 'off' : 'on' });
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileName = file.name;
                    files[fileName] = e.target.result;
                    switchToFile(fileName);
                };
                reader.readAsText(file);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 's':
                        e.preventDefault();
                        saveFile();
                        break;
                    case 'n':
                        e.preventDefault();
                        newFile();
                        break;
                    case '/':
                        e.preventDefault();
                        toggleLineComment();
                        break;
                }
            }
        });
    </script>
</body>
