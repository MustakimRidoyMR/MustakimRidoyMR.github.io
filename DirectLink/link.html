<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপনার সেরা সুযোগ!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #a7bfe8, #6190e8);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 400px;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(0, 120, 212, 0.7), rgba(138, 43, 226, 0.7));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            width: auto;
            max-width: 260px;
            white-space: normal;
            word-wrap: break-word;
        }
        
        .glass-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(0, 120, 212, 0.8), rgba(138, 43, 226, 0.8));
        }

        .glass-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-30deg);
            transition: all 0.5s ease;
        }

        .glass-button:hover::before {
            left: 100%;
        }

        #main-heading {
            color: #ffffff;
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            padding: 0 10px;
        }

        #sub-paragraph {
            color: #e2e8f0;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            padding: 0 10px;
            line-height: 1.3;
        }

        /* মোবাইল ডিভাইসের জন্য অপ্টিমাইজেশন */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
                margin: 5px;
            }

            .glass-button {
                font-size: 1.1rem;
                padding: 12px 20px;
                margin: 0 auto;
            }

            #main-heading {
                font-size: 1.5rem;
                margin-bottom: 0.8rem;
            }

            #sub-paragraph {
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }
        }

        /* ছোট মোবাইল ডিভাইসের জন্য */
        @media (max-width: 320px) {
            .glass-button {
                font-size: 1rem;
                padding: 10px 15px;
            }

            #main-heading {
                font-size: 1.3rem;
            }

            #sub-paragraph {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="main-heading"></h1>
        <p id="sub-paragraph"></p>
        <a href="#" target="_blank" class="glass-button" id="dynamic-button"></a>
    </div>

    <script>
        const languagePacks = [
            {
                lang: "bn",
                heading: "আপনার জন্য বিশেষ কিছু!",
                paragraph: "আর অপেক্ষা নয়! আপনার সেরা সুযোগটি খুঁজে নিতে এখনই ক্লিক করুন।",
                buttonText: "আপনার সেরা সুযোগটি খুঁজে নিন! ✨"
            },
            {
                lang: "en",
                heading: "Something Special For You!",
                paragraph: "Don't wait! Click now to discover your best opportunity.",
                buttonText: "Discover Your Best Opportunity! ✨"
            },
            {
                lang: "hi",
                heading: "आपके लिए कुछ खास!",
                paragraph: "इंतजार न करें! अपना सबसे अच्छा अवसर खोजने के लिए अभी क्लिक करें।",
                buttonText: "अपना सर्वश्रेष्ठ अवसर खोजें! ✨"
            }
        ];

        const allLinks = [
            "https://otieu.com/4/9570463",
            "https://otieu.com/4/9621191",
            "https://www.profitableratecpm.com/m7j44g75?key=90f36207646d410dc5c03e6c6816a890", 
            "https://otieu.com/4/9621194",
            "https://www.profitableratecpm.com/bgueicec6u?key=25ef22e0d741bad03030bc8ccc60f19d"
        ];

        window.onload = function() {
            const randomLangPack = languagePacks[Math.floor(Math.random() * languagePacks.length)];
            const randomLink = allLinks[Math.floor(Math.random() * allLinks.length)];

            const mainHeading = document.getElementById('main-heading');
            const subParagraph = document.getElementById('sub-paragraph');
            const dynamicButton = document.getElementById('dynamic-button');

            if (mainHeading) {
                mainHeading.textContent = randomLangPack.heading;
            }
            if (subParagraph) {
                subParagraph.textContent = randomLangPack.paragraph;
            }
            if (dynamicButton) {
                dynamicButton.textContent = randomLangPack.buttonText;
                dynamicButton.href = randomLink;
            }
        };
    </script>
</body>
</html>
